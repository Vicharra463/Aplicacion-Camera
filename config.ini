; ============================================================
;  Configuracion - Servidor FTP Camara CYTV Ancon
;  IMPORTANTE: cambie la password antes de subirlo al servidor
; ============================================================

[ftp]
puerto = 2121
usuario = admin
password = Kratos2005
; Rango de puertos pasivos que debe abrir el firewall (TCP)
puertos_pasivos = 60000-60099
; Timeout de conexion inactiva (segundos)
timeout_segundos = 30
; Maximo de conexiones simultaneas
max_conexiones = 20

[rutas]
; RUTAS ABSOLUTAS SIEMPRE: sin rutas relativas, el servicio funciona igual
; aunque se lance desde el escritorio, desde otra carpeta o bajo NSSM
; (que arranca con otro directorio de trabajo). El servidor verifica cada
; carpeta al arrancar y la CREA si falta, avisando la ruta en el log.
recibidos = C:\CytvAncon\ftp_recibidos
procesadas = C:\CytvAncon\imagenes_procesadas
registro = C:\CytvAncon\registro.db
; Log FUERA de OneDrive: si OneDrive bloquea la escritura del archivo, el
; hilo que escribe se traba y se congela el servidor FTP entero.
logs = C:\CytvAncon\logs
heartbeat = C:\CytvAncon\heartbeat.txt
; Reportes JSON diarios: placas-YYYY-MM-DD.json se genera y refresca solo
reportes = C:\CytvAncon\reportes
[aoi]
; Claves de PlateRecognizer (API de lectura de placas), separadas por coma.
; El servicio las prueba EN ORDEN: si una clave se queda sin cuota (HTTP
; 402/403) la aparta 1 h y pasa a la siguiente; recien cuando TODAS fallan
; interviene el motor local (CRNN+RapidOCR). Vacio = AOI desactivada.
; Ejemplo: tokens = sk_primera, sk_segunda, sk_tercera
; Tambien se pueden SUMAR claves con la variable de entorno
; PLATERECOGNIZER_TOKEN (se concatenan con estas). Si este archivo vive en
; un repo con git, no commitee las claves: edite este [aoi] en el servidor.
tokens = ec6ad5583d7e476bcb27143f53cf77e4ba622e6e
[camara]
; Canales de la TandemVu (mapeo corregido 2026-10-16):
;   01 = PT (~2x pixeles en la placa)  -> imagenes_procesadas\placa\
;   02 = panoramico                    -> imagenes_procesadas\placa\
;     (ambos canales se procesan como placa; ya no hay carpeta vehiculo)
; Control de pasadas (Fase 1): minutos minimos entre visitas de la misma
; placa, ventana de dias y maximo de pasadas por ventana (mas alla se
; guarda con sufijo EXCEDIDA y alerta WARNING en el log).
ventana_reinspeccion_min = 60
ventana_reinspeccion_dias = 30
max_pasadas = 3
; Segundos de espera tras GUARDAR una placa antes de tomar la proxima foto
; (cooldown). Protege la cuota de la API y evita reprocesar la misma escena.
cooldown_placa_seg = 5

[recursos]
; Minutos sin fotos antes de liberar los modelos (detector, OCR, CRNN) y
; bajar la prioridad del proceso a idle. La proxima foto los recarga sola.
; 0 = desactiva el reposo (modelos siempre en memoria).
reposo_minutos = 10

[duplicados]
; % minima de cambio visual para aceptar una imagen nueva
umbral_diferencia = 8.0

[inicio]
; Re-evaluar con la logica actual lo que ya esta en descartadas\<dia>
; cada vez que arranca el servicio (si/no). Lo rescatado entra como
; PLACA (DUDOSA) y lo ilegible se elimina; duplicados NO se re-evaluan
; (purga diaria 19:00). La cola avanza solo cuando casi se vacia:
; lo en vivo siempre tiene prioridad.
replay_descartes = si
; Segundos de pausa entre foto y foto del replay al arrancar
replay_pausa_seg = 1.0

[filtros]
; Que pasa con las imagenes que no pasan los filtros:
;   retener  = se mueven a descartadas\YYYY-MM-DD\<motivo> (auditable y
;              reintentable: scripts\replay_descartes.py las devuelve a
;              la cola cuando el modelo o la flota mejoran)
;   eliminar = se borran de inmediato (ahorra disco; la decision queda
;              registrada en registro.db igual que con retener)
; 2026-10-19: retener para no perder evidencia de placas no leidas.
modo_descarte = retener
; Confianza minima del modelo ONNX (modelo\placas.onnx) para decir "hay
; placa". Medido en produccion 2026-10-09: placas reales 0.81 y 0.82,
; falsos positivos (timestamp OSD, placa cortada) 0.34 y 0.45 -> 0.5 los
; deja afuera. Sube si una placa real lejana queda fuera.
umbral_modelo = 0.40
; Requiere que el OCR lea el recorte como placa (ABC-123 / AB-1234).
;   si = no se guarda nada que no se pueda leer (matan falsos positivos)
;   no = si el OCR no leyÃ³, se guarda igual y manda el hash perceptual
ocr_requerido = si
; % de pixeles oscuros (texto) que debe tener el recorte: una placa tiene
; caracteres. Ruido y regiones lisas quedan fuera.
umbral_texto_min = 5.0
umbral_texto_max = 55.0
; Nitidez minima del RECORTE de la placa (varianza del Laplaciano).
; Medida sobre el recorte, nunca sobre la foto completa.
umbral_nitidez = 120.0
; % maximo de pixeles saturados (>250): evita placas quemadas por el IR
umbral_sobreexpuesto = 2.0
; % minimo de bordes en el recorte: si es muy bajo, algo la esta tapando
umbral_bordes = 2.0
; Distancia hamming maxima (hash perceptual de 64 bits) para considerar que
; dos recortes son la MISMA placa. Medido en produccion 2026-10-09:
;   misma placa (CBN-449 en 2 frames) = 14 bits
;   placas distintas                  = 22 bits minimo, 30 de mediana
; 18 deja 4 bits de margen a cada lado.
umbral_dedup_dist = 18
; Carpeta de descartes, ruta absoluta
descartes = C:\CytvAncon\descartadas

[log]
; DEBUG | INFO | WARNING | ERROR
nivel = INFO
; Cuantos archivos de log rotados se conservan (rotacion nocturna)
retencion_dias = 30

